services:
  ollama:
    # Build straight from your GitHub repo (no local clone needed)
    image: appwrite/ollama
    restart: unless-stopped
    environment:
      # entrypoint.sh pulls these at runtime if not already present
      MODELS: llama3.2:1b
      # duration to keep model in memory
      OLLAMA_KEEP_ALIVE: 24h
    ports:
      - "11434:11434"
    volumes:
      # local: named volume `models`. CI sets OLLAMA_DATA to a host dir that
      # actions/cache persists, so the model isn't re-pulled every run.
      - ${OLLAMA_DATA:-models}:/root/.ollama
    healthcheck:
      # healthy only once the first MODELS entry is downloaded, so `up --wait`
      # doesn't return while the model is still pulling. $$ -> literal $ so the
      # container's shell expands MODELS.
      test: ["CMD-SHELL", "ollama list | grep -qi \"$${MODELS%%,*}\""]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  models:
