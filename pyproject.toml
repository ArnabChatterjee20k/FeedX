[project]
name = "feedx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "appwrite>=19.2.0",
    "black>=26.5.1",
    "domdistill",
    "fastapi[standard]>=0.139.0",
    "pydantic-ai-slim[openai]>=2.13.0",
    "pydantic-ai[openai]>=2.13.0",
    "pyjwt>=2.13.0",
    "pynacl>=1.6.2",
    "python-dotenv>=1.2.2",
    "scout",
]

[project.scripts]
feedx = "src.cli:cli"

[dependency-groups]
# e2e test tooling. The console bootstrap (project/key/db) is done over raw HTTP
# with `requests` (pulled in transitively by the appwrite SDK), so only pytest is
# needed here. Install with: uv sync --group dev
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# tests import the app as `from src.api import create_api`, so put the repo root
# (this dir) on the path. e2e tests self-skip when console creds are absent.
pythonpath = ["."]
testpaths = ["tests"]

# Fetch these over plain HTTP (GitHub source tarballs, pinned to a commit) instead of
# `git+https`, so builders without the `git` binary (e.g. the Appwrite Sites /
# openruntimes image) can still install them. Bump the SHA to upgrade.
[tool.uv.sources]
scout = { url = "https://github.com/ArnabChatterjee20k/Scout/archive/ad6b4b85a9180f52f5cb4a42f7b724787d15af7f.tar.gz" }
domdistill = { url = "https://github.com/ArnabChatterjee20k/domdistill/archive/56eb5b18afbb774324843708f041c76c8b6d3930.tar.gz" }
