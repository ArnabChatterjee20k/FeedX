[project]
name = "feedx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "appwrite>=19.2.0",
    "black>=26.5.1",
    "domdistill",
    "fastapi[standard]>=0.139.0",
    "pydantic-ai-slim[openai]>=2.13.0",
    "pydantic-ai[openai]>=2.13.0",
    "pyjwt>=2.13.0",
    "pynacl>=1.6.2",
    "python-dotenv>=1.2.2",
    "scout",
]

[project.scripts]
feedx = "src.cli:cli"

[dependency-groups]
# e2e test tooling. `appwrite-console` bootstraps a throwaway project/key/db
# (Console operations a project API key can't perform). Install with:
#   uv sync --group dev
dev = [
    "pytest>=8.0",
    "appwrite-console>=0.3.0",
]

[tool.pytest.ini_options]
# tests import the app as `from src.api import create_api`, so put the repo root
# (this dir) on the path. e2e tests self-skip when console creds are absent.
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
scout = { git = "https://github.com/ArnabChatterjee20k/Scout.git" }
domdistill = { git = "https://github.com/ArnabChatterjee20k/domdistill.git" }
