name: feed

# Feed builder: ranks the last-N-days COMPLETED content, selects the feed
# (budget + MMR), publishes feeds/<YYYY-MM-DD>.json to the content repo, and
# marks the selected content as shown. One-shot — runs and exits.
on:
  schedule:
    - cron: "0 5 * * *" # daily, 05:00 UTC
  workflow_dispatch:

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
      APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
      ENVIRONMENT: production
      CRAWL_ID: ${{ github.run_id }}
      FEED_WINDOW_DAY: "30"
      FEED_LIMIT: "10"
      # publishes to a SEPARATE content repo, so FEED_TOKEN is a PAT with
      # contents:write on that repo (the auto GITHUB_TOKEN can't reach it). Names
      # avoid the GITHUB_ prefix so they're read verbatim — no mapping.
      FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
      FEED_REPO: ${{ vars.FEED_REPO }}
      FEED_BRANCH: ${{ vars.FEED_BRANCH || 'main' }}
      FEED_DIR: ${{ vars.FEED_DIR || 'feeds' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-feedx
      - name: Build & publish feed
        id: feed
        run: |
          set -o pipefail  # keep a failed build failing through tee
          uv run python -m src.cli feed 2>&1 | tee feed.log
          echo "count=$(grep -oE 'Published [0-9]+ items' feed.log | grep -oE '[0-9]+' | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Ping Exploud with the new feed
        if: success()
        uses: ./.github/actions/exploud
        with:
          endpoint: ${{ secrets.EXPLOUD_URL }}
          token: ${{ secrets.EXPLOUD_TOKEN }}
          source: feedx
          title: Today's feed is out
          body: ${{ steps.feed.outputs.count && format('{0} new items on openfeed.', steps.feed.outputs.count) || 'The feed was published.' }}
          url: https://openfeed.appwrite.network/
      - name: Ping Exploud on failure
        if: failure()
        uses: ./.github/actions/exploud
        with:
          endpoint: ${{ secrets.EXPLOUD_URL }}
          token: ${{ secrets.EXPLOUD_TOKEN }}
          source: feedx
          title: Feed build failed
          body: Today's feed was not published. Tap for the run log.
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
