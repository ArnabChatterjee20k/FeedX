name: crawl

# Crawl pipeline: expands sources -> urls and crawls url content into the DB.
# Sources and content urls flow through the same run (kind = source | url).
on:
  schedule:
    - cron: "0 2 * * *" # daily, before content so the day's crawl is ready to enrich
  workflow_dispatch:
    inputs:
      workers:
        description: number of crawl workers
        default: "2"

# don't overlap runs — a new run rebuilds the queues from the DB.
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # the workers loop until the queues drain / idle; this bounds the run. a hard
    # timeout can leave stale FETCHING rows (lease auto-expires in 10m; a reaper
    # for stuck rows is a planned follow-up — see plan.md). keep this comfortably
    # above WORKER_MAX_RUNTIME_SECONDS so the graceful stop always wins the race.
    timeout-minutes: 70
    env:
      APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
      APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
      ENVIRONMENT: production
      CRAWL_ID: ${{ github.run_id }}
      # stop gracefully before the hard timeout so stop() can clean up (no stale
      # FETCHING rows from a hard kill); idle-stop usually ends it sooner.
      WORKER_MAX_RUNTIME_SECONDS: "3600"
      HEADLESS: "true" # required on the headless CI runner
      SOURCE_REFRESH_SECONDS: "21600" # 6h source re-discovery gate
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-feedx
      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium
      - name: Enable unprivileged user namespaces (Chromium sandbox on ubuntu-24.04)
        # Scout launches Chromium directly without --no-sandbox; ubuntu-24.04
        # AppArmor-restricts unprivileged userns, which kills the sandbox before
        # the CDP port opens. Re-enable it so the browser starts.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run crawl pipeline
        run: uv run python -m src.cli crawler crawl --workers "${{ github.event.inputs.workers || '2' }}"
